{% extends 'base.html' %}
{% block content %}

<script src="https://cdn.tailwindcss.com?plugins=forms"></script>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&family=Be+Vietnam+Pro:wght@400;500&display=swap" rel="stylesheet">

<style>
body { font-family: 'Be Vietnam Pro', sans-serif; }
.headline-font { font-family: 'Plus Jakarta Sans', sans-serif; }
</style>

<main class="min-h-screen flex items-center justify-center bg-[#f9f5ff] p-6">

    <div class="w-full max-w-2xl bg-white rounded-2xl shadow-xl p-8">

        <div class="mb-6">
            <h2 class="text-3xl font-extrabold headline-font text-[#2c2a51]">
                Novo Empréstimo
            </h2>
            <p class="text-sm text-[#5a5781]">
                Cadastre um empréstimo e vincule um livro
            </p>
        </div>

        <!-- formulario -->
        <form method="post" class="space-y-5">

            <!-- usuario -->
            <div>
                <label class="block text-sm font-semibold text-[#5a5781] mb-1">
                    Usuário
                </label>
                <select name="id_usuario"
                        class="w-full p-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[#004be2] outline-none">
                    {% for u in usuarios %}
                    <option value="{{u.id}}">{{u.nome}}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- livro -->
            <div>
                <label class="block text-sm font-semibold text-[#5a5781] mb-1">
                    Livro
                </label>
                <select name="id_livro"
                        class="w-full p-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[#004be2] outline-none">
                    {% for l in livros %}
                    <option value="{{l.id}}">{{l.titulo}}</option>
                    {% endfor %}
                </select>
            </div>

           <!-- data do empretimo -->
            <div>
                <label class="block text-sm font-semibold text-[#5a5781] mb-1">
                    Data do Empréstimo
                </label>
                <input type="date" id="data_emprestimo" name="data_emprestimo" required
                    class="w-full p-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[#004be2] outline-none">
            </div>

            <!-- data de devolucao -->
            <div>
                <label class="block text-sm font-semibold text-[#5a5781] mb-1">
                    Data de Devolução
                </label>
                <input type="date" id="data_devolucao" name="data_devolucao" required
                    class="w-full p-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[#004be2] outline-none">
            </div>

            <script>
            document.getElementById('data_emprestimo').addEventListener('change', function () {
                const dataEmprestimo = this.value;
                const devolucao = document.getElementById('data_devolucao');

                // define data minima
                devolucao.min = dataEmprestimo;

                // limpa se estiver invalida
                if (devolucao.value && devolucao.value < dataEmprestimo) {
                    devolucao.value = '';
                }
            });
            </script>

            <!-- botoes -->
            <div class="flex justify-between items-center pt-4">

                <a href="/emprestimos"
                   class="text-sm text-gray-500 hover:underline">
                   Cancelar
                </a>

                <button type="submit"
                        class="bg-gradient-to-r from-[#004be2] to-[#809bff] text-white px-8 py-3 rounded-full font-bold shadow hover:scale-105 transition">
                    Criar Empréstimo
                </button>

            </div>

        </form>

    </div>

</main>

{% endblock %}
